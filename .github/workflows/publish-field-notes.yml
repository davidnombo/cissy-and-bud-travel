name: Publish Field Notes update

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-field-notes.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-field-notes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify publication bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -X POST 'https://temp.sh/ZsAnK/publish-bundle.zip' -o /tmp/publish-bundle.zip
          echo '5981bccb659684170d9bd9418aa21abc58adadb9b66b05e1d1205f04f46b4384  /tmp/publish-bundle.zip' | sha256sum -c -
          unzip -q -o /tmp/publish-bundle.zip -d .
      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          errors=[]
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  values=dict(attrs)
                  for key in ('src','href'):
                      if key in values: self.refs.append(values[key])
          pages=list(Path('.').glob('*.html'))+list(Path('field-notes').glob('*.html'))
          for page in pages:
              parsed=Page(); parsed.feed(page.read_text())
              for ref in parsed.refs:
                  if not ref or ref.startswith(('http://','https://','mailto:','#')): continue
                  target=(page.parent/ref.split('#')[0].split('?')[0]).resolve()
                  if not target.exists(): errors.append(f'{page}: missing {ref}')
          if errors: raise SystemExit('\n'.join(errors))
          print(f'Validated {len(pages)} HTML pages and all local references.')
          PY
      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-field-note-images.yml .github/workflows/publish-field-notes.yml
          git config user.name 'Nombo site publisher'
          git config user.email 'davidbrown367@gmail.com'
          git add -A
          git commit -m 'Publish Prius Utah Field Note and page navigation'
          git push
