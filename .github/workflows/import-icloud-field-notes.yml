name: Import iCloud Field Notes Photos

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import_icloud_field_notes.py
      - .github/workflows/import-icloud-field-notes.yml

permissions:
  contents: write

concurrency:
  group: import-icloud-field-notes
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download and optimize shared-album photos
        run: python scripts/import_icloud_field_notes.py
      - name: Commit refreshed photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/field-notes
          if git diff --cached --quiet; then
            echo "No photo changes"
          else
            git commit -m "assets: refresh iCloud field note photos"
            git push
          fi
